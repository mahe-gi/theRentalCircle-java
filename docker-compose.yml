name: platform

services:
  postgres:
    image: postgres:17.11-alpine
    container_name: platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dev_platform}
      POSTGRES_USER: ${POSTGRES_USER:-dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_insecure_password_replace_in_prod}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - platform-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev_user} -d ${POSTGRES_DB:-dev_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: platform-backend:dev
    container_name: platform-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dev_platform}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-dev_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-dev_insecure_password_replace_in_prod}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_key_minimum_32_characters_for_local_testing_only!}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      REFRESH_TOKEN_EXPIRATION_MS: ${REFRESH_TOKEN_EXPIRATION_MS:-604800000}
      FILE_UPLOAD_DIR: /var/app/uploads
      FILE_SECURE_DOCS_DIR: /var/app/secure-docs
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      OAUTH2_REDIRECT_URI: ${OAUTH2_REDIRECT_URI:-http://localhost:3000/auth/callback}
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/var/app/uploads
      - secure_docs_data:/var/app/secure-docs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - platform-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

