server:
  port: 8080

spring:
  application:
    name: platform-backend
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:dev_platform}
    username: ${POSTGRES_USER:dev_user}
    password: ${POSTGRES_PASSWORD:dev_insecure_password_replace_in_prod}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:REPLACE_ME}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:REPLACE_ME}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

app:
  jwt:
    secret: ${JWT_SECRET:dev_jwt_secret_key_minimum_32_characters_for_local_testing_only!}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:604800000}
  upload:
    dir: ${APP_UPLOAD_DIR:/var/app/uploads/properties}
  document:
    dir: ${APP_DOCUMENT_DIR:/var/app/secure-docs}
  storage:
    upload-dir: ${FILE_UPLOAD_DIR:/var/app/uploads}
    secure-docs-dir: ${FILE_SECURE_DOCS_DIR:/var/app/secure-docs}
  cookie:
    secure: ${COOKIE_SECURE:false}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/auth/callback}
